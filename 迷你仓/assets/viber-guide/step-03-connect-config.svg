  <g font-family="Arial,'Microsoft YaHei'"><circle cx="425" cy="214" r="18" fill="#6f40ff"/><text x="419" y="221" font-size="16" fill="#fff">✓</text><text x="460" y="221" font-size="17" fill="#6f40ff">基本信息</text><path d="M550 214h260" stroke="#6f40ff"/><circle cx="845" cy="214" r="18" fill="#6f40ff"/><text x="839" y="221" font-size="16" fill="#fff">2</text><text x="880" y="221" font-size="17" font-weight="700" fill="#6f40ff">连接配置</text></g>

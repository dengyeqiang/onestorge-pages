  <text x="390" y="382" font-family="Arial,'Microsoft YaHei'" font-size="18" font-weight="600" fill="#3d424a">Authentication Token *</text><text x="390" y="408" font-family="Arial,'Microsoft YaHei'" font-size="14" fill="#a3a7ae">凭证将加密保存在服务端，不会展示给其他成员。</text><rect x="390" y="424" width="820" height="62" rx="10" fill="#fff" stroke="#daddE4"/><text x="412" y="463" font-family="Arial,'Microsoft YaHei'" font-size="18" fill="#30353c">••••••••••••••••••••••••</text><path d="M1080 424v62" stroke="#daddE4"/><text x="1115" y="463" font-family="Arial,'Microsoft YaHei'" font-size="17" fill="#656b74">显示</text>
